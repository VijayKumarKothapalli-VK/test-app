# Generated by mule-cicd-kit 1.0.0 - do not edit by hand.
name: Mule CI/CD - test-app

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: mule-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  PIPELINE_BUILD_ID: ${{ github.run_number }}
  ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
  ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: bash cicd/mule-cicd.sh build

  publish:
    name: Publish to Exchange
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: bash cicd/mule-cicd.sh publish

  deploy-sandbox:
    name: Deploy to sandbox
    needs: publish
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: bash cicd/mule-cicd.sh deploy sandbox
